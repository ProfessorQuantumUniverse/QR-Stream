<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-Stream: Visuelle Datenübertragung</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 50px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transform: translateY(-20px);
            transition: all 0.3s ease;
        }

        h1 {
            font-size: 2.5em;
            color: #1a1a1a;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 40px;
        }

        .navigation {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        .nav-button {
            display: block;
            padding: 15px 30px;
            font-size: 1.2em;
            font-weight: bold;
            text-decoration: none;
            color: #fff;
            border-radius: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .nav-button.sender {
            background: linear-gradient(45deg, #007BFF, #0056b3);
        }

        .nav-button.receiver {
            background: linear-gradient(45deg, #28a745, #1e7e34);
        }

        .nav-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .nav-button:active {
            transform: translateY(0);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>QR-Stream</h1>
        <p class="subtitle">Ein experimentelles Projekt zur "air-gapped" Datenübertragung via animierter QR-Codes.</p>
        <nav class="navigation">
            <a href="/main%20html/sender.html" class="nav-button sender">Daten Senden</a>
            <a href="/main%20html/receiver.html" class="nav-button receiver">Daten Empfangen</a>
        </nav>
    </div>
</body>
</html>
