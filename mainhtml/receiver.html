<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>QR-Stream Empfänger (Multi-Code)</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        #video-container { position: relative; width: 400px; height: 300px; }
        video { width: 100%; height: 100%; }
        #result-container { width: 80%; margin-top: 20px; }
        #progress { font-style: italic; color: #555; }
        pre { white-space: pre-wrap; word-wrap: break-word; background: #f4f4f4; padding: 10px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h1>QR-Stream Empfänger</h1>
    <p>Richten Sie Ihre Kamera auf den Stream. Erkennt QR- und Data-Matrix-Codes.</p>
    <button id="start-scan-btn">Scan starten</button>
    <div id="video-container">
        <video id="video-preview" playsinline></video>
    </div>
    <div id="result-container">
        <h3>Ergebnis:</h3>
        <div id="progress">Warte auf Daten...</div>
        <pre id="result-text"></pre>
    </div>

    <!-- NEUE BIBLIOTHEK: zxing-js kann viele Formate lesen -->
    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/zxing-library.min.js"></script>
    <script>
        const startScanBtn = document.getElementById('start-scan-btn');
        const video = document.getElementById('video-preview');
        const progressEl = document.getElementById('progress');
        const resultEl = document.getElementById('result-text');

        let receivedChunks = {};
        let totalChunks = 0;
        let animationFrameId = null;

        // ZXing-Code-Reader initialisieren
        const codeReader = new ZXing.BrowserMultiFormatReader();

        startScanBtn.addEventListener('click', async () => {
            startScanBtn.style.display = 'none';
            progressEl.textContent = 'Starte Kamera...';
            try {
                // Die decodeFromVideoDevice-Methode von ZXing ist sehr praktisch
                codeReader.decodeFromVideoDevice(undefined, 'video-preview', (result, err) => {
                    if (result) {
                        // Ein Code wurde gefunden!
                        processCode(result.getText());
                    }
                    if (err && !(err instanceof ZXing.NotFoundException)) {
                        console.error("Scan-Fehler:", err);
                    }
                });
                progressEl.textContent = 'Kamera aktiv. Scanne...';
            } catch (err) {
                alert("Kamerazugriff fehlgeschlagen: " + err);
                startScanBtn.style.display = 'block';
            }
        });
        
        function processCode(data) {
            try {
                // Das Protokoll bleibt dasselbe, daher muss hier nichts geändert werden
                const parts = data.split('|');
                if (parts.length < 3) return;

                const chunkNum = parseInt(parts[0], 10);
                const currentTotal = parseInt(parts[1], 10);
                const chunkData = parts.slice(2).join('|');

                if (!receivedChunks[chunkNum]) {
                    totalChunks = currentTotal;
                    receivedChunks[chunkNum] = chunkData;

                    const receivedCount = Object.keys(receivedChunks).length;
                    progressEl.textContent = `Pakete empfangen: ${receivedCount} von ${totalChunks}`;
                    
                    if (receivedCount === totalChunks) {
                        reassembleAndDisplay();
                    }
                }
            } catch (e) {
                // Fehler ignorieren
            }
        }

        function reassembleAndDisplay() {
            let fullText = "";
            for (let i = 1; i <= totalChunks; i++) {
                fullText += receivedChunks[i];
            }
            resultEl.textContent = fullText;
            progressEl.textContent = "Übertragung abgeschlossen!";
            
            // Stoppt den Scan und gibt die Kamera frei
            codeReader.reset();
        }
    </script>
</body>
</html>
