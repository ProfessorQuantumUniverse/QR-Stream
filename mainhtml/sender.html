<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>QR-Stream Sender (Multi-Code)</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .controls { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
        textarea { width: 80%; min-height: 150px; }
        #qr-container { width: 400px; height: 400px; border: 1px solid #ccc; }
        /* Wir verwenden jetzt ein Canvas-Element, da die neue Bibliothek direkt darauf zeichnet */
        #barcode-canvas { width: 100%; height: 100%; image-rendering: pixelated; }
    </style>
    <!-- NEUE BIBLIOTHEK: bwip-js kann viele Barcode-Typen erstellen -->
    <script src="https://cdn.jsdelivr.net/npm/bwip-js@3.2.0/dist/bwip-js-min.js"></script>
</head>
<body>
    <h1>QR-Stream Sender</h1>
    <p>Wählen Sie den Code-Typ und geben Sie Ihren Text ein.</p>
    
    <div class="controls">
        <label for="code-type">Code-Typ:</label>
        <select id="code-type">
            <option value="qrcode">QR Code (Standard)</option>
            <option value="datamatrix">Data Matrix (Hohe Dichte)</option>
        </select>
        <button id="generate-btn">Stream generieren</button>
    </div>

    <textarea id="text-input" placeholder="Langer Text hier..."></textarea>
    
    <div id="qr-container">
        <!-- Ein Canvas ist flexibler für die neue Bibliothek -->
        <canvas id="barcode-canvas"></canvas>
    </div>

    <script>
        const textInput = document.getElementById('text-input');
        const generateBtn = document.getElementById('generate-btn');
        const codeTypeSelect = document.getElementById('code-type');
        const canvas = document.getElementById('barcode-canvas');
        
        let animationInterval = null;
        let generatedBarcodes = [];
        let currentIndex = 0;

        generateBtn.addEventListener('click', () => {
            const text = textInput.value;
            if (!text) {
                alert("Bitte geben Sie Text ein.");
                return;
            }
            if (animationInterval) clearInterval(animationInterval);

            const selectedType = codeTypeSelect.value;
            
            // Passen Sie die Chunk-Größe basierend auf dem Typ an.
            // Data Matrix kann bei gleicher Komplexität mehr Daten aufnehmen.
            const chunkSize = selectedType === 'datamatrix' ? 600 : 400;
            const chunks = [];
            for (let i = 0; i < text.length; i += chunkSize) {
                chunks.push(text.substring(i, i + chunkSize));
            }

            generatedBarcodes = chunks.map((chunk, index) => {
                return {
                    bcid: selectedType,
                    text: `${index + 1}|${chunks.length}|${chunk}`,
                    scale: 5,
                    width: 80, height: 80, // Wird an Canvas angepasst
                    includetext: false,
                };
            });
            
            currentIndex = 0;
            drawBarcode(); // Zeichne den ersten Frame sofort

            animationInterval = setInterval(() => {
                currentIndex = (currentIndex + 1) % generatedBarcodes.length;
                drawBarcode();
            }, 150);
        });

        function drawBarcode() {
            if (generatedBarcodes.length === 0) return;
            const barcodeData = generatedBarcodes[currentIndex];
            
            // bwip-js zeichnet direkt auf ein (temporäres) Canvas
            const tempCanvas = document.createElement('canvas');
            try {
                bwipjs.toCanvas(tempCanvas, barcodeData);
                // Skalieren Sie das Bild auf das Anzeige-Canvas
                const ctx = canvas.getContext('2d');
                canvas.width = 400;
                canvas.height = 400;
                ctx.imageSmoothingEnabled = false; // Wichtig für scharfe Pixel
                ctx.drawImage(tempCanvas, 0, 0, canvas.width, canvas.height);
            } catch (e) {
                console.error("Fehler beim Generieren des Barcodes:", e);
                // Stoppe die Animation bei einem Fehler
                if (animationInterval) clearInterval(animationInterval);
                alert("Fehler beim Erstellen des Codes. Möglicherweise ist der Text zu lang für einen einzelnen Chunk.");
            }
        }
    </script>
</body>
</html>
