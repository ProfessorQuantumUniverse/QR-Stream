<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>QR-Stream Sender (Optimiert)</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        textarea { width: 80%; min-height: 150px; margin-bottom: 20px; }
        #qr-container { width: 400px; height: 400px; border: 1px solid #ccc; }
        #qr-image { width: 100%; height: 100%; image-rendering: pixelated; /* Sorgt für scharfe Kanten */ }
    </style>
</head>
<body>
    <h1>QR-Stream Sender</h1>
    <p>Geben Sie hier Ihren Text ein. Er wird in eine animierte QR-Code-Sequenz umgewandelt.</p>
    <textarea id="text-input" placeholder="Langer Text hier..."></textarea>
    <button id="generate-btn">QR-Stream generieren</button>
    <div id="qr-container">
        <img id="qr-image" src="" alt="Hier erscheint der QR-Code-Stream">
    </div>

    <!-- Wir binden die QR-Code-Bibliothek ein -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <script>
        const textInput = document.getElementById('text-input');
        const generateBtn = document.getElementById('generate-btn');
        const qrImage = document.getElementById('qr-image');
        
        let animationInterval = null;

        generateBtn.addEventListener('click', () => {
            const text = textInput.value;
            if (!text) {
                alert("Bitte geben Sie Text ein.");
                return;
            }

            // Stoppe eine laufende Animation
            if (animationInterval) clearInterval(animationInterval);

            // =======================
            // === ÄNDERUNG NR. 1 ===
            // =======================
            // Wir erhöhen die Datenmenge pro Paket drastisch von 150 auf 400 Zeichen.
            // Dies erzeugt komplexere QR-Codes mit mehr Informationen.
            const chunkSize = 400; 

            const chunks = [];
            for (let i = 0; i < text.length; i += chunkSize) {
                chunks.push(text.substring(i, i + chunkSize));
            }

            const totalChunks = chunks.length;
            const qrDataUrls = chunks.map((chunk, index) => {
                const packet = `${index + 1}|${totalChunks}|${chunk}`;
                
                // Wir verwenden eine niedrige Fehlerkorrektur ('L'), um die maximale Datenkapazität zu nutzen.
                const qr = qrcode(0, 'L'); // 0 = auto-detect size, L = Low error correction (ca. 7%)
                qr.addData(packet);
                qr.make();
                return qr.createDataURL(8); // Kleinere Pixelgröße für dichtere Codes
            });

            let currentIndex = 0;

            // =======================
            // === ÄNDERUNG NR. 2 ===
            // =======================
            // Wir beschleunigen die Animation, indem wir das Intervall von 250ms auf 150ms reduzieren.
            // Das entspricht ~6.6 Frames pro Sekunde.
            animationInterval = setInterval(() => {
                qrImage.src = qrDataUrls[currentIndex];
                currentIndex = (currentIndex + 1) % qrDataUrls.length;
            }, 150); 
        });
    </script>
</body>
</html>
