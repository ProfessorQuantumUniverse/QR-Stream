name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

      # The site is static and runs straight from the repository layout; the
      # single-file build is published alongside it under /offline/ so it can be
      # downloaded and carried to a machine with no network.
      - name: Build the offline bundle
        run: |
          node tools/build.js
          mkdir -p _site
          cp -r index.html assets app src mainhtml _site/
          cp -r dist _site/offline

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
